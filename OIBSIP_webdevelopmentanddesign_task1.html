<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landing Page</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

nav{
    background:#101820;
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav h1{
    color:#00d084;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.hero{
    height:100vh;
    background:linear-gradient(to right,#00d084,#101820);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    padding:20px;
}

.hero h2{
    font-size:60px;
    margin-bottom:20px;
}

.hero p{
    font-size:22px;
    margin-bottom:30px;
}

.btn{
    background:white;
    color:#101820;
    padding:15px 30px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

footer{
    background:#101820;
    color:white;
    text-align:center;
    padding:20px;
}
</style>
</head>

<body>

<nav>
    <h1>Landing Page</h1>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

<section class="hero">
    <div>
        <h2>Welcome To My Website</h2>

        <p>
            Modern Landing Page using HTML, CSS & JavaScript
        </p>

        <a href="#" class="btn">Get Started</a>
    </div>
</section>

<footer>
    © 2026 Landing Page
</footer>

</body>
</html>
