<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(to right,#00d084,#101820);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.converter{
    background:white;
    padding:40px;
    border-radius:10px;
    width:400px;
}

.converter h2{
    text-align:center;
    margin-bottom:20px;
    color:#101820;
}

.converter input,
.converter select{
    width:100%;
    padding:12px;
    margin:12px 0;
    font-size:18px;
}

.converter button{
    width:100%;
    padding:14px;
    background:#00d084;
    color:white;
    border:none;
    font-size:18px;
    cursor:pointer;
    border-radius:5px;
}

.converter button:hover{
    background:#00b374;
}

#result{
    margin-top:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#101820;
}
</style>
</head>

<body>

<div class="converter">

    <h2>Temperature Converter</h2>

    <input type="number" id="temp" placeholder="Enter temperature">

    <select id="type">
        <option value="ctof">Celsius to Fahrenheit</option>
        <option value="ftoc">Fahrenheit to Celsius</option>
    </select>

    <button id="convertBtn">Convert</button>

    <div id="result"></div>

</div>

<script>

document.getElementById("convertBtn").addEventListener("click", function () {

    let temp = parseFloat(document.getElementById("temp").value);

    let type = document.getElementById("type").value;

    let result = document.getElementById("result");

    if (isNaN(temp)) {

        result.innerHTML = "Please enter a valid number";
        return;
    }

    if (type === "ctof") {

        let fahrenheit = (temp * 9/5) + 32;

        result.innerHTML =
        temp + " °C = " + fahrenheit.toFixed(2) + " °F";
    }

    else {

        let celsius = (temp - 32) * 5/9;

        result.innerHTML =
        temp + " °F = " + celsius.toFixed(2) + " °C";
    }

});

</script>

</body>
</html>
